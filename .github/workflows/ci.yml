name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bash:
    name: Bash (shellcheck + bats)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats
          bats --version
          shellcheck --version

      - name: ShellCheck
        run: make lint-sh

      - name: Bats
        run: bats --tap tests

  powershell:
    name: PowerShell (PSScriptAnalyzer + Pester)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Lint and test
        shell: pwsh
        run: ./powershell/Invoke-Checks.ps1 -Task All
